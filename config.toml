# ============================================================================
#  PriceRadar 配置
#  改完直接生效，不需要改代码。
# ============================================================================

[general]
digest_size = 10              # 每天推送几篇
lookback_days = 14            # 出版日期回溯窗口（天）
indexed_lookback_days = 4     # 「新被数据库收录」的回溯窗口，捕捉在线优先论文
max_per_journal = 3           # 单本期刊最多几篇，保证来源多样性
require_price_relevance = true
mailto = "2485892471@qq.com"   # 放到 OpenAlex 的 polite pool，建议改成你的邮箱
http_timeout = 45
request_interval = 0.2        # 请求间隔（秒），不要低于 0.1
per_page = 100

# 分享给别人时填上公网地址，RSS 订阅源才会指向正确位置。
#   GitHub Pages     → "https://你的用户名.github.io/price-radar"
#   Cloudflare Pages → "https://price-radar.pages.dev"
#   局域网共享        → "http://192.168.x.x:8080"
public_url = ""
site_title = "价格研究日报"


# ---------------------------------------------------------------------------
#  数据源开关
#  Crossref 是主干（免费、无需 Key、按 ISSN 精确覆盖每本期刊）；
#  ScienceDirect RSS 只对 Elsevier 期刊生效，用来补精确在线日期和原文链接；
#  Semantic Scholar 批量补摘要 + 免费全文链接（一次请求可查 200 个 DOI）；
#  OpenAlex 摘要质量最好，但 2026 年起按额度计费，匿名请求共用同 IP 的
#  每日免费额度（约 100 次请求）。建议去 openalex.org 申请免费 Key：
#      $env:OPENALEX_API_KEY = "你的key"
#  额度用尽会自动熔断，不会影响其他数据源。
# ---------------------------------------------------------------------------

[sources]
crossref = true
science_direct_rss = true
semantic_scholar = true
openalex = true
unpaywall = true                # 免费、无需 Key：找合法免费全文链接
unpaywall_max = 40              # 只为打分最高的前 N 篇查（逐篇接口，别设太大）
enrich_missing_abstract = true   # 只对「缺摘要」的文章发起补充请求，省额度
crossref_rows = 200              # 每本期刊每次最多取多少条
s2_batch_size = 200              # Semantic Scholar 单次批量上限（官方上限 500）
s2_interval = 3.5                # S2 请求间隔，未配 Key 时容易被限流，别调太小
openalex_max_calls = 60          # OpenAlex 本次运行最多调用几次（熔断保护）
# openalex_api_key = ""          # 也可以直接写在这里，或用环境变量 OPENALEX_API_KEY
# s2_api_key = ""                # 或用环境变量 SEMANTIC_SCHOLAR_API_KEY


# ---------------------------------------------------------------------------
