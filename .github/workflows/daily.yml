name: PriceRadar 每日价格研究推送
on:
  schedule:
    # GitHub Actions 用的是 UTC。00:30 UTC = 北京时间 08:30
    - cron: "30 0 * * *"
  workflow_dispatch:      # 也可以在网页上手动点一下立刻跑
    inputs:
      limit:
        description: "推送篇数（留空用 config.toml 的值）"
        required: false
        default: ""
permissions:
  contents: write          # 需要把生成的日报提交回仓库，供 GitHub Pages 展示
concurrency:
  group: priceradar
  cancel-in-progress: false
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 纯标准库，无需 pip install；这一步只是为了确认环境
      - name: 环境检查
        run: python -c "import sys; print(sys.version)"
      - name: 首次解析期刊（有缓存则跳过）
        run: |
          if [ ! -f data/sources_cache.json ]; then
            python -m priceradar resolve
          fi
        env:
          PRICERADAR_MAILTO: ${{ secrets.PRICERADAR_MAILTO }}
      - name: 生成日报
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            python -m priceradar run --limit ${{ github.event.inputs.limit }}
          else
            python -m priceradar run
          fi
        env:
          PRICERADAR_MAILTO: ${{ secrets.PRICERADAR_MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
      - name: 提交日报（让 GitHub Pages 能展示）
        run: |
          git config user.name  "priceradar-bot"
          git config user.email "priceradar-bot@users.noreply.github.com"
          git add data/out data/priceradar.sqlite3 data/sources_cache.json 2>/dev/null || true
          git diff --cached --quiet && echo "没有变化" || \
            git commit -m "chore(digest): $(date -u +%F) 价格研究日报"
      - name: 推送
        run: git push
      - name: 上传日报为构建产物（便于下载）
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: |
            data/out/*.md
            data/out/*.html
            data/out/*.json
            data/out/feed.xml
          retention-days: 30
  # ---------------------------------------------------------------------------
  #  可选：发布到公网，让任何人都能用网址打开（免费、自动 HTTPS）
  #
  #  启用两步：
  #    1) 仓库 Settings → Pages → Source 选 "GitHub Actions"
  #    2) 仓库 Settings → Secrets and variables → Actions → Variables
  #       新建一个变量：ENABLE_PAGES = true
  #  之后每次运行都会自动更新公网看板，网址形如：
  #    https://你的用户名.github.io/仓库名/
  #
  #  不想公开？删掉下面这整个 pages 任务即可，其余功能不受影响。
  # ---------------------------------------------------------------------------
  pages:
    needs: digest
    if: ${{ vars.ENABLE_PAGES == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: data/out
      - id: deploy
        uses: actions/deploy-pages@v4
